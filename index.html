<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>天气仪表盘</title>
    <style>
        /* ---------- 原有样式 ---------- */
        body { font-family: Arial; max-width: 1200px; margin: auto; padding: 20px; background: #f9f9f9; }
        nav { background: #2c3e50; padding: 12px; position: sticky; top: 0; border-radius: 8px; z-index: 900; }
        nav a { color: white; margin-right: 20px; text-decoration: none; font-weight: bold; }
        section { margin: 40px 0; padding-top: 20px; }
        .chart { width: 100%; height: 500px; }
        footer { text-align: center; margin-top: 40px; color: gray; }

        /* ---------- 动态天气图标 (动画) ---------- */
        .weather-icon {
            position: fixed;
            pointer-events: none;   /* 让图标不干扰点击 */
            z-index: 1000;
            font-size: 40px;
            opacity: 0.7;
        }

        /* 旋转太阳 */
        .sun {
            top: 20px;
            right: 20px;
            animation: spin 12s linear infinite;
            font-size: 48px;
            opacity: 0.9;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        /* 移动云朵（从左到右） */
        .cloud-left {
            bottom: 10%;
            left: -100px;
            animation: moveCloud 25s linear infinite;
        }
        .cloud-right {
            top: 15%;
            right: -100px;
            animation: moveCloud 35s linear infinite reverse; /* 从右向左 */
        }
        @keyframes moveCloud {
            from { transform: translateX(0); }
            to   { transform: translateX(calc(100vw + 200px)); }
        }

        /* 移动雨滴（下落 + 左右飘移） */
        .rain {
            top: -20px;
            left: 15%;
            animation: rainFall 2.5s linear infinite;
            font-size: 28px;
        }
        .rain2 {
            top: -30px;
            left: 65%;
            animation: rainFall 3s linear infinite 0.5s;
        }
        @keyframes rainFall {
            0%   { transform: translateY(0) translateX(0); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { transform: translateY(calc(100vh + 50px)) translateX(30px); opacity: 0; }
        }

        /* 飘浮的雾气（水平飘移 + 透明度变化） */
        .fog {
            bottom: 5%;
            left: -150px;
            animation: fogFloat 20s linear infinite;
            font-size: 60px;
            opacity: 0.3;
        }
        .fog2 {
            bottom: 15%;
            left: 50%;
            animation: fogFloat 25s linear infinite reverse;
        }
        @keyframes fogFloat {
            from { transform: translateX(0); opacity: 0.2; }
            to   { transform: translateX(calc(100vw + 200px)); opacity: 0.5; }
        }
    </style>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>

<!-- 动态天气图标元素 -->
<div class="weather-icon sun">🌞</div>
<div class="weather-icon cloud-left">☁️</div>

<div class="weather-icon rain">💧</div>

<div class="weather-icon fog">🌫️</div>
<div class="weather-icon fog2">🌫️</div>
