name: Update Weather Dashboard

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pandas plotly

      - name: Generate dashboard
        run: |
          python generate_dashboard.py
          echo "=== 当前目录文件列表 ==="
          ls -la
          echo "=== 检查 index.html ==="
          if [ -f index.html ]; then echo "index.html 存在"; else echo "index.html 不存在"; exit 1; fi

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git pull origin main --rebase
          git add index.html
          git commit -m "Auto-update weather dashboard" || echo "没有新变化"
          git push origin main
